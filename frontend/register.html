<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Fintech Recommender</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231976d2'/%3E%3Ctext x='50' y='68' font-family='Arial,sans-serif' font-size='60' font-weight='700' text-anchor='middle' fill='white'%3E%E2%82%AC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<div class="auth-container">
    <h1 class="auth-logo">Fintech Recommender</h1>
    <h2 class="auth-titulo">Crear cuenta</h2>
    <p>Regístrate para acceder a recomendaciones financieras personalizadas</p>

    <div id="auth-mensaje" class="oculto"></div>

    <form id="form-registro" class="auth-form">
        <label>
            Nombre de usuario:
            <input type="text" id="reg-usuario" autocomplete="name" required minlength="3">
        </label>
        <label>
            Correo electrónico:
            <input type="email" id="reg-correo" autocomplete="username" required>
        </label>
        <label>
            Contraseña:
            <input type="password" id="reg-password" autocomplete="new-password" required minlength="6">
        </label>
        <label>
            Repetir contraseña:
            <input type="password" id="reg-password2" autocomplete="new-password" required minlength="6">
        </label>
        <label>
            ¿Cómo describirías tu situación financiera?
            <select id="reg-perfil" name="perfilFinanciero" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="ENDEUDADO_CRONICO">Voy ahogado de deudas</option>
                <option value="ENDEUDADO_AL_DIA">Tengo deudas pero al día</option>
                <option value="HOLGADO">Tengo dinero de sobra</option>
            </select>
        </label>
        <button type="submit">Registrarse</button>
    </form>

    <p class="auth-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>
</div>
<script src="auth.js?v=2"></script>
<script src="register.js?v=2"></script>
</body>
</html>
